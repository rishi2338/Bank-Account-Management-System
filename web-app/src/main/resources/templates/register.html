<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Northstar Bank</title><link rel="stylesheet" th:href="@{/styles.css}"></head><body class="auth-page"><main class="auth-shell"><a class="brand" href="/"><span class="brand-mark">N</span> NORTHSTAR <span>BANK</span></a><section class="auth-card"><p class="eyebrow">GET STARTED</p><h1>Open your<br>account.</h1><p class="muted">Create your local demo banking account.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" action="/register"><label>Full name<input name="fullName" maxlength="100" required autocomplete="name"></label><label>Email address<input type="email" name="email" maxlength="150" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password"><small>Use at least 8 characters.</small></label><button class="primary full" type="submit">Create account <span>→</span></button></form><p class="switch">Already registered? <a href="/login">Sign in</a></p></section><p class="footnote">LOCAL DEMO BANKING APPLICATION · DO NOT USE REAL FINANCIAL DATA</p></main></body></html>
